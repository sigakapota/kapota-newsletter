name = "kapota-newsletter"
main = "src/index.js"
compatibility_date = "2026-09-09"

# 11:00 UTC = 08:00 horário de Brasília. Brasil não observa horário de
# verão desde 2019 (Decreto 9.772), então esse offset é estável o ano todo.
[triggers]
crons = ["0 11 * * 1"]

[vars]
WORKER_URL = "https://kapota-newsletter.sigakapota.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "kapota_newsletter"
database_id = "b5401e79-80a9-426c-ba27-38ca84fe2d49"
